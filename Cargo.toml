[package]
name = "main"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mdns-sd = "0.21"
axum = { version = "0.8", features = ["multipart", "ws"] }
reqwest = { version = "0.13", features = ["multipart"] }
infer = "0.22"
rustls = "0.23"
rcgen = "0.14"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["image-defaults", "crossterm"] }
crossterm = "0.29"